name: Build APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false
      - name: Build release APK
        run: cd android && gradle assembleRelease --no-daemon --stacktrace
      - name: Versão do app
        run: echo "APP_VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)" >> "$GITHUB_ENV"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk segunda-tela.apk
      - uses: actions/upload-artifact@v4
        with:
          name: segunda-tela-apk
          path: segunda-tela.apk
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}
          name: Segunda Tela ${{ env.APP_VER }} - App Android
          body: |
            Instale **segunda-tela.apk** no tablet. No PC, use o instalador da release servidor-v3.0.
          files: segunda-tela.apk
