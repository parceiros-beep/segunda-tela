name: Build APK
on:
  push:
    paths-ignore:
      - 'revoo/**'
      - '.github/workflows/build-revoo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: Z=$(ls *.zip | head -1); mkdir -p project; unzip -o "$Z" -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false
      - name: Build release APK
        run: cd project && gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp project/app/build/outputs/apk/release/app-release.apk segunda-tela.apk
      - uses: actions/upload-artifact@v4
        with:
          name: segunda-tela-apk
          path: segunda-tela.apk
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Segunda Tela v1.0
          files: segunda-tela.apk
