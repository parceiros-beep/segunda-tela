name: Build Revoo APK
on:
  push:
    paths:
      - 'revoo/**'
      - '.github/workflows/build-revoo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revoo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk revoo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: revoo-apk
          path: revoo/revoo.apk
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: revoo-v1.0
          name: Revoo v1.0
          files: revoo/revoo.apk
