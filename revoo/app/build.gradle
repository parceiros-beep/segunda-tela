plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.revoo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.revoo.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty('RV_STORE_FILE') ?: '../keystore/revoo.jks')
            storePassword project.findProperty('RV_STORE_PASSWORD') ?: 'revoo123456'
            keyAlias project.findProperty('RV_KEY_ALIAS') ?: 'revoo'
            keyPassword project.findProperty('RV_KEY_PASSWORD') ?: 'revoo123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
